<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowFin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F3F4F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlowFin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Swiss Grid: one ink colour on a cool paper ground, rules instead of boxes, red only as a signal.
   Layout: top nav row, then one content column on a 12-column grid. Deliberately single-theme (light). */
:root{
  --bg:#F3F4F2; --paper:#FFFFFF; --ink:#121413; --muted:#5B605C; --faint:#8A8F8B; --rule:#D3D6D2;
  --signal:#C8102E; --good:#1E6B45;
  --f-sans:Archivo,"Helvetica Neue",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* frame */
.shell{max-width:1200px;margin:0 auto;padding:28px max(40px,env(safe-area-inset-right,0px)) 72px max(40px,env(safe-area-inset-left,0px))}
.topnav{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 30px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:36px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand b{color:var(--signal)}
.navlinks{display:flex;flex-wrap:wrap;gap:4px 22px;flex:1 1 auto}
.navlink{border:0;background:none;padding:0 0 3px;cursor:pointer;color:var(--muted);font-size:14px;border-bottom:2px solid transparent}
.navlink:hover{color:var(--ink)}
.navlink.on{color:var(--ink);font-weight:600;border-bottom-color:var(--signal)}
.navlink small{font-size:10px;color:var(--faint);margin-left:3px}
.wrap{display:grid;gap:40px}
.bottomnav{display:none}

/* page header */
.topbar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.topbar h1{margin:0 auto 0 0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.period{display:flex;align-items:center;gap:8px}
.period span{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.iconbtn{border:1px solid var(--ink);background:transparent;width:34px;height:34px;cursor:pointer;font-size:16px}
.iconbtn:hover{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--ink);background:transparent;padding:0 14px;height:34px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--ink);color:var(--bg);font-weight:600}
.btn.primary:hover{background:#2B2F2D}
.btn.danger{color:var(--signal);border-color:var(--signal)}
.btn.danger:hover{background:var(--signal);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--good)} .dot.busy{background:var(--faint)} .dot.err{background:var(--signal)}

/* sections replace cards: a rule on top, no box */
.card{border-top:2px solid var(--ink);padding:14px 0 0;min-width:0}
.card h3{margin:0 0 12px;font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h3 .r{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
.soon{color:var(--muted)}
.soon ul{margin:8px 0 0;padding-left:18px}

/* hero */
.hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:28px;align-items:end}
.hero .main{grid-column:span 8;min-width:0}
.hero .side{grid-column:span 4;min-width:0}
.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.bignum{display:flex;align-items:baseline;gap:14px;margin-top:4px;flex-wrap:wrap}
.bignum .cur{font-size:30px;font-weight:500;color:var(--muted)}
.bignum .val{font-size:clamp(84px,12vw,148px);font-weight:800;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.why{margin:16px 0 0;font-size:15px;color:var(--muted);max-width:36rem}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--rule);padding:12px 0}
.line:first-child{border-top-color:var(--ink)}
.line span:first-child{font-size:14px}
.line .num{font-size:22px;font-weight:500}
.progress{height:4px;background:var(--rule);margin-top:10px}
.progress i{display:block;height:4px;background:var(--ink)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:2px solid var(--ink)}
.kpi{padding:14px 16px;border-right:1px solid var(--rule);min-width:0}
.kpi:first-child{padding-left:0}
.kpi:last-child{border-right:0;padding-right:0}
.kpi label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-mono);font-weight:500;font-size:22px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.neg{color:var(--signal)} .pos{color:inherit}
.tag{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 5px;border:1px solid var(--rule);color:var(--muted);vertical-align:2px;margin-left:4px}
.tag.exp,.tag.sch{border-color:var(--ink);color:var(--ink)}
.tag.ex{border-color:var(--signal);color:var(--signal)}

/* chart */
.chartbox{position:relative;height:260px}
.legend{display:flex;gap:18px;font-size:13px;color:var(--muted);font-weight:400}
.legend i{display:inline-block;width:18px;vertical-align:middle;margin-right:4px}

/* budgets + lists */
.budget{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;padding:12px 0 0}
.budget .bar{grid-column:1/-1;height:6px;background:var(--rule);margin-top:6px}
.budget .bar i{display:block;height:6px;background:var(--ink)}
.budget .bar i.over{background:var(--signal)}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.rowline:last-child{border-bottom:0}
.rowline .sub{color:var(--muted)}
.acct{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.acct div{min-width:0}
.acct label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.acct .num{display:block;font-size:22px;margin-top:6px}
.acct small{color:var(--muted);font-size:12px}

/* transactions */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select,.field input,.field select{background:var(--paper);border:1px solid var(--ink);border-radius:0;padding:0 10px;height:36px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.sumbar{display:flex;flex-wrap:wrap;gap:20px;font-size:13px;color:var(--muted)}
.sumbar b{font-family:var(--f-mono);font-weight:500;color:var(--ink);margin-left:6px}
.daygroup h4{margin:22px 0 0;padding-bottom:6px;font-size:12px;color:var(--muted);font-weight:500;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--ink)}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.tx:hover{background:var(--paper)}
.tx .sw{display:none}
.tx .d{min-width:0}
.tx .d b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d small{color:var(--muted);font-size:12px}
.tx .a{font-family:var(--f-mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tx .a.in{color:var(--good)}
.empty{color:var(--muted);padding:28px 0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,20,19,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg);border-top:4px solid var(--ink);width:min(500px,100%);max-height:92vh;overflow:auto;padding:22px;display:grid;gap:14px}
.modal h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink)}
.seg button{border:0;border-right:1px solid var(--ink);background:none;height:36px;cursor:pointer;font-size:13px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .left{margin-right:auto}
.err{color:var(--signal);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:13px;z-index:60}

@media (max-width:980px){
  .hero .main,.hero .side{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(3n){border-right:0;padding-right:0}
  .kpi:nth-child(3n+1){padding-left:0}
  .kpi:nth-child(-n+3){border-bottom:1px solid var(--rule)}
}
@media (max-width:720px){
  .shell{padding:18px max(20px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
  .navlinks{display:none}
  .topnav{margin-bottom:24px}
  .wrap{gap:30px}
  .topbar h1{font-size:24px}
  .grid2,.acct{grid-template-columns:1fr}
  .grid2{gap:30px}
  .bignum .cur{font-size:18px}
  .formgrid{grid-template-columns:1fr}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch;position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--ink);padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px));z-index:40}
  .bottomnav button{border:0;border-top:3px solid transparent;background:none;color:var(--muted);font-size:11px;padding:12px 2px 14px;cursor:pointer}
  .bottomnav button.on{color:var(--ink);font-weight:700;border-top-color:var(--signal)}
  .bottomnav button.plus{font-size:26px;line-height:1;color:var(--ink);padding-top:8px}
}
/* checkpoint 2 widgets */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:14px}
.trio div{min-width:0}
.trio label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.trio .num{display:block;font-size:22px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trio small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.minibar{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:12px;align-items:center;font-size:13px;padding:5px 0}
.minibar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minibar .bar{height:6px;background:var(--rule)}
.minibar .bar i{display:block;height:6px;background:var(--ink)}
.minibar .num{text-align:right}
.week{display:grid;grid-template-columns:170px minmax(0,1fr) 260px;gap:18px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.week:last-child{border-bottom:0}
.week.future{color:var(--faint)}
.wk b{display:block;font-size:14px}
.wk span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.week .bar{position:relative;height:8px;background:var(--rule)}
.week .bar i{display:block;height:8px;background:var(--ink)}
.week .bar i.over{background:var(--signal)}
.week .bar em{position:absolute;top:-4px;width:1px;height:16px;background:var(--ink)}
.wn{text-align:right;min-width:0}
.wn small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn small.neg{color:var(--signal)}
.fcrow{padding:9px 0;border-bottom:1px solid var(--rule)}
.fct{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:7px;flex-wrap:wrap}
.fcbar{position:relative;height:8px}
.fcbar b{position:absolute;left:0;top:0;height:8px;background:var(--rule)}
.fcbar i{position:absolute;left:0;top:0;height:8px;background:var(--ink)}
.fcbar i.over{background:var(--signal)}
.fcbar em.budget{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);margin-left:-1px}
@media (max-width:720px){
  .week{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  .week .bar{grid-column:1/-1;grid-row:2}
  .wn small{max-width:46vw}
  .minibar{grid-template-columns:100px minmax(0,1fr) 76px}
  .trio .num{font-size:18px}
}
/* budgets page */
.bcard{display:grid;gap:10px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.bbar{position:relative;height:8px;background:var(--rule)}
.bbar i{display:block;height:8px;background:var(--ink)}
.bbar i.over{background:var(--signal)}
.bbar em{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);margin-left:-1px}
.bmeta{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;color:var(--muted)}
.bmeta .neg{color:var(--signal)}
.bedit{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;padding-top:4px}
.bedit .field{width:180px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;min-height:36px}
.switch input{width:18px;height:18px;accent-color:var(--ink)}
.switch input:disabled + span{color:var(--faint)}
.ledger summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0}
.ledger summary:hover{color:var(--ink)}
.ltable{overflow-x:auto}
.ltable div{display:grid;grid-template-columns:minmax(170px,1.6fr) repeat(3,minmax(90px,1fr));gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13px;min-width:460px}
.ltable div span:not(:first-child){text-align:right}
.ltable .lh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom-color:var(--ink)}
.ltable .cur{color:var(--muted)}
/* round 3: folds, drill-through, split bars */
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h3{margin:0}
details.fold>summary h3::before{content:"+";font-family:var(--f-mono);font-weight:500;width:18px;display:inline-block}
details.fold[open]>summary h3::before{content:"–"}
details.fold[open]>summary h3{margin-bottom:12px}
details.fold>summary:hover h3{color:var(--muted)}
.foldbody{padding-bottom:4px}
.drill{cursor:pointer}
.drill:hover{background:var(--paper)}
.rowline.drill:hover,.fcrow.drill:hover{box-shadow:-8px 0 0 var(--paper),8px 0 0 var(--paper)}
.fcnote{font-size:12px;color:var(--muted);margin-top:5px}
.subhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.subhead b{font-size:16px}
.subhead span{font-size:13px;color:var(--muted)}
.splitlabel{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.split{display:flex;height:14px;background:var(--rule);overflow:hidden;gap:2px}
.split i{display:block;height:14px;flex:none}
.splitkey{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:7px}
.splitkey i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.splitkey .neg{color:var(--signal)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.chip{border:1px solid var(--ink);padding:2px 8px;font-size:12px}
.wk span{white-space:nowrap}
.wk b .tag{margin-left:6px}
.projnote{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.goalproj{margin-top:18px}
.collmode{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;margin-bottom:16px}
.seg2{display:flex;border:1px solid var(--ink)}
.seg2 button{border:0;background:none;height:30px;padding:0 12px;cursor:pointer;font-size:13px}
.seg2 button+button{border-left:1px solid var(--ink)}
.seg2 button.on{background:var(--ink);color:var(--bg);font-weight:600}
/* rules, tags, foreign currency */
.rulenote{font-size:12px;color:var(--muted);border-left:2px solid var(--ink);padding-left:8px}
.fxbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:12px}
.tagrow,.bulktag{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.tagchip{border:1px solid var(--rule);background:var(--paper);padding:3px 8px;font-size:12px;cursor:pointer}
.tagchip:hover{border-color:var(--ink)}
.tagchip b{font-family:var(--f-mono);font-weight:500;margin-left:4px}
.bulktag input{background:var(--paper);border:1px solid var(--ink);height:32px;padding:0 8px;min-width:0;flex:0 1 220px}
.bulktag .btn{height:32px}
.hash{font-family:var(--f-mono);font-size:11px;color:var(--ink);margin-left:2px}
.ruleadd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.ruleadd .field{flex:1 1 150px}
.ruleadd .field:first-child{flex:2 1 200px}
/* recurring + upcoming */
.upcoming{border-top:1px solid var(--ink);padding-top:10px;margin-top:-12px}
.uphead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-size:14px;margin-bottom:8px}
.uphead .navlink{margin-left:auto}
.upstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.up{flex:0 0 auto;min-width:150px;max-width:200px;border:1px solid var(--rule);background:var(--paper);padding:8px 10px;display:grid;gap:2px}
.up .ud{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.up .un{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .ua{font-size:15px}
.up.in .ua{color:var(--good)}
.up .uk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rtable{overflow-x:auto}
.rtable>div{display:grid;grid-template-columns:minmax(220px,2.4fr) 120px 110px 100px 120px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);min-width:640px;font-size:14px}
.rtable>div span:nth-child(n+2):nth-child(-n+4){text-align:right}
.rtable .rh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom-color:var(--ink)}
.rtable b{font-weight:500;display:block}
.rtable small{color:var(--muted);font-size:12px}
.rtable .off{color:var(--faint)}
.rtable .inflow{color:var(--good)}
.rtable select{background:var(--paper);border:1px solid var(--ink);height:30px;padding:0 6px}
.chartnote{margin:-4px 0 10px;font-size:13px;color:var(--muted);max-width:70rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topnav" id="side"></header>
  <div class="wrap" id="view"></div>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<div id="modalRoot"></div>

<script>
// ─── Module-level state: declared before the IIFE (Holotrack rule) ───────────
var API_DEFAULT = 'https://script.google.com/macros/s/AKfycbwLF5qwgGlH6lfdGfleNTkDhvJfIRhzHV7uQ7NjhZ3MqsINq25QGp9wVhWeWO7veicH6A/exec';
var URL_KEY = 'ff_url_v1';
var CACHE_KEY = 'ff_cache_v1';
var KEY_KEY = 'ff_key_v1';
var _cache = null;                         // last good data payload (also in localStorage)
var TABLES = ['Transaction','Rule','Budget','CategorySettings','FundAllocation','FinancialGoal','GoalContribution','Subscription','NetWorthEntry','AssetSnapshot','Settings'];
var DATA = {};                              // table name → rows
var UI = { page:'dashboard', periodOffset:0, sync:'idle', syncMsg:'', lastSync:null,
           tx:{ scope:'period', q:'', type:'', category:'', account:'', sub:'', from:'', to:'', tag:'', dayToDay:false } };
var CHARTS = {};
var START_DAY = 10;
var EXPECTED_HOUSEHOLD_EXPENSE = 6700;
var BENCHMARK_SALARY = 8500, BENCHMARK_INFRA = 6700;
var HIST_MONTHS = 6;
var WEALTH_CATS = { 'Financial Investing':1, 'Collectibles':1, 'Retirement 3a':1 };
var CATEGORIES = {
  'Family Infrastructure':['Mortgage','Utilities','Groceries','Insurance','Transportation','Childcare','Activities','Vacations','General Household'],
  'Personal Cash':['Lunches','Dinners','Drinks','Coffees','Snacks','Hobbies','Subscriptions','Entertainment','Presents','Cash','Extras'],
  'Retirement 3a':[],
  'Financial Investing':['ETF Investing','Forex Investing','Funds'],
  'Collectibles':['TCG Investing']
};
var CAT_COLOR = { 'Family Infrastructure':'var(--c-infra)', 'Personal Cash':'var(--c-personal)', 'Retirement 3a':'var(--c-3a)', 'Financial Investing':'var(--c-fin)', 'Collectibles':'var(--c-coll)' };
var TYPES = [['expense','Expense'],['income','Income'],['refund','Refund'],['investment','Investment']];
var ACCOUNTS = [['credit_card','Credit card'],['debit_card','Debit card']];
var NAV = [
  { label:'Overview', items:[['dashboard','Dashboard'],['transactions','Transactions']] },
  { label:'Planning', items:[['budgets','Budgets'],['goals','Goals'],['subscriptions','Recurring']] },
  { label:'Analysis', items:[['anomalies','Anomaly Review'],['monthly','Monthly']] },
  { label:'Wealth',   items:[['wealth','Wealth & Assets']] },
  { label:'App',      items:[['settings','Settings']] }
];
var MOBILE_NAV = [['dashboard','Home'],['transactions','Spend'],['add','+'],['budgets','Budgets'],['settings','More']];
var BUILT = { dashboard:1, transactions:1, budgets:1, subscriptions:1, settings:1 };

(function () {
  'use strict';

  // ─── helpers ──────────────────────────────────────────────────────────────
  var fmtCHF = new Intl.NumberFormat('de-CH', { minimumFractionDigits:2, maximumFractionDigits:2 });
  var fmt0 = new Intl.NumberFormat('de-CH', { maximumFractionDigits:0 });
  function chf(n) { return 'CHF ' + fmtCHF.format(n || 0); }
  function chf0(n) { return fmt0.format(Math.round(n || 0)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function $(id) { return document.getElementById(id); }
  function pd(s) { var p = String(s).slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function apiUrl() { return lsGet(URL_KEY) || API_DEFAULT; }
  function apiKey() { return lsGet(KEY_KEY) || ''; }
  function txs() { return DATA.Transaction || []; }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }

  // ─── periods (10th → 9th) ─────────────────────────────────────────────────
  function periodFor(date) {
    var y = date.getFullYear(), m = date.getMonth();
    if (date.getDate() < START_DAY) m -= 1;
    return { start:new Date(y, m, START_DAY), end:new Date(y, m + 1, START_DAY - 1) };
  }
  function periodAt(offset) {
    var p = periodFor(today());
    return periodFor(new Date(p.start.getFullYear(), p.start.getMonth() + offset, START_DAY));
  }
  function periodLabel(p) {
    function dm(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.'; }
    return dm(p.start) + ' – ' + dm(p.end) + p.end.getFullYear();
  }
  function inPeriod(tx, p) { if (!tx.date) return false; var d = pd(tx.date); return d >= p.start && d <= p.end; }

  // ─── category roles (CategorySettings) ────────────────────────────────────
  function roles() {
    var cs = DATA.CategorySettings || [];
    return {
      salary: cs.filter(function (s) { return s.role === 'salary'; }).map(function (s) { return s.category; }),
      infra:  cs.filter(function (s) { return s.role === 'infrastructure'; }).map(function (s) { return s.category; })
    };
  }
  function isSalary(tx, r) { if (tx.type !== 'income') return false; return r.salary.length ? r.salary.indexOf(tx.category) > -1 : true; }
  function isInfra(tx, r)  { if (tx.type !== 'expense') return false; return r.infra.length ? r.infra.indexOf(tx.category) > -1 : tx.category === 'Family Infrastructure'; }
  function isEntertainment(tx) { return tx.type === 'expense' && (tx.subcategory === 'Entertainment' || tx.category === 'Entertainment'); }

  // ─── THE totals function (mirrors Base44 calculations.js) ─────────────────
  // Future-dated transactions are "scheduled", never "spent".
  function calcTotals(list, cutoff, expectedIncome, expectedExpense) {
    var income = 0, raw = 0, fin = 0, coll = 0, threeA = 0, refunds = 0, scheduled = 0;
    list.forEach(function (tx) {
      var a = +tx.amount || 0;
      if (tx.date && pd(tx.date) > cutoff) {
        if (WEALTH_CATS[tx.category] || isEntertainment(tx)) scheduled += a;
        return;
      }
      if (tx.type === 'income') income += a;
      else if (tx.type === 'refund') refunds += a;
      else if (tx.category === 'Collectibles') coll += a;
      else if (tx.category === 'Financial Investing') fin += a;
      else if (tx.category === 'Retirement 3a') threeA += a;
      else if (tx.type === 'expense') raw += a;
    });
    var actualIncome = income;
    income += expectedIncome > 0 ? expectedIncome : 0;
    var expenses = Math.max(0, raw - refunds) + (expectedExpense > 0 ? expectedExpense : 0);
    var netCashFlow = income - expenses, netSaved = netCashFlow - coll;
    return { income:income, actualIncome:actualIncome, expectedIncome:expectedIncome || 0, expectedExpense:expectedExpense || 0,
      expenses:expenses, refunds:refunds, financialInvesting:fin, collectibles:coll, threeA:threeA, scheduled:scheduled,
      netCashFlow:netCashFlow, netSaved:netSaved, savingsRate: income > 0 ? netSaved / income : 0 };
  }

  // Average salary and household over the last 6 periods that had income
  function monthlyAverages() {
    var r = roles(), all = txs(), ti = 0, tf = 0, n = 0;
    for (var i = 1; i <= HIST_MONTHS; i++) {
      var p = periodAt(-i), pi = 0, pf = 0;
      all.forEach(function (tx) {
        if (!inPeriod(tx, p)) return;
        if (isSalary(tx, r)) pi += +tx.amount || 0;
        if (isInfra(tx, r))  pf += +tx.amount || 0;
      });
      if (pi > 0) { ti += pi; tf += pf; n++; }
    }
    var avgIncome = n ? ti / n : 0, avgInfra = n ? tf / n : 0;
    var free = Math.max(0, avgIncome - avgInfra);
    if (!free) free = Math.max(0, BENCHMARK_SALARY - BENCHMARK_INFRA);
    return { avgIncome:avgIncome, avgInfra:avgInfra, freeCash:free, periods:n };
  }

  // Everything the dashboard needs for one period
  function periodModel(offset) {
    var p = periodAt(offset), t = today(), r = roles();
    var isCurrent = offset === 0;
    var cutoff = isCurrent ? t : p.end;
    var list = txs().filter(function (tx) { return inPeriod(tx, p); });
    var avg = monthlyAverages();
    var hasSalary = list.some(function (tx) { return isSalary(tx, r) && pd(tx.date) <= cutoff; });
    var hasInfra = list.some(function (tx) { return isInfra(tx, r) && pd(tx.date) <= cutoff; });
    var expInc = (isCurrent && !hasSalary) ? avg.avgIncome : 0;
    var expExp = (isCurrent && !hasInfra) ? EXPECTED_HOUSEHOLD_EXPENSE : 0;
    var totals = calcTotals(list, cutoff, expInc, expExp);

    var daysInPeriod = daysBetween(p.start, p.end) + 1;
    var daysElapsed = isCurrent ? Math.min(daysInPeriod, daysBetween(p.start, t) + 1) : daysInPeriod;
    var dailyBudget = avg.freeCash / daysInPeriod;

    // daily spend: non-infra expenses minus refunds (investment-type rows excluded)
    var dailyMap = {};
    list.forEach(function (tx) {
      if (tx.type === 'expense') { if (isInfra(tx, r)) return; dailyMap[tx.date] = (dailyMap[tx.date] || 0) + (+tx.amount || 0); }
      else if (tx.type === 'refund') { dailyMap[tx.date] = (dailyMap[tx.date] || 0) - (+tx.amount || 0); }
    });
    var spentToday = isCurrent ? (dailyMap[ymd(t)] || 0) : 0;

    // free cash: accrued − paid (Financial Investing + Collectibles + entertainment, up to today)
    var paid = 0, sched = 0;
    list.forEach(function (tx) {
      if (!(tx.category === 'Financial Investing' || tx.category === 'Collectibles' || isEntertainment(tx))) return;
      if (pd(tx.date) <= cutoff) paid += +tx.amount || 0; else sched += +tx.amount || 0;
    });
    var accrued = dailyBudget * daysElapsed;
    var availableNow = accrued - paid;

    return { p:p, list:list, totals:totals, avg:avg, isCurrent:isCurrent, cutoff:cutoff,
      daysInPeriod:daysInPeriod, daysElapsed:daysElapsed, dailyBudget:dailyBudget, dailyMap:dailyMap,
      spentToday:spentToday, safeToday:Math.max(0, dailyBudget - spentToday),
      accrued:accrued, paid:paid, scheduledFree:sched, availableNow:availableNow, afterScheduled:availableNow - sched };
  }

  // ─── network (never set a Content-Type header — Holotrack rule) ───────────
  function setSync(state, msg) { UI.sync = state; UI.syncMsg = msg || ''; var el = $('syncState'); if (el) el.outerHTML = syncHTML(); }
  function syncHTML() {
    var cls = UI.sync === 'ok' ? 'ok' : UI.sync === 'busy' ? 'busy' : UI.sync === 'err' ? 'err' : '';
    var txt = UI.sync === 'busy' ? 'Syncing…' : UI.sync === 'err' ? (UI.syncMsg || 'Offline') :
      UI.lastSync ? 'Synced ' + UI.lastSync.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) : 'Not synced';
    return '<span class="sync" id="syncState" title="' + esc(UI.syncMsg) + '"><i class="dot ' + cls + '"></i>' + esc(txt) + '</span>';
  }
  function loadAll() {
    setSync('busy');
    return fetch(apiUrl() + '?key=' + encodeURIComponent(apiKey())).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error || 'Backend error');
      applyData(j.data);
      _cache = { data:j.data, at:Date.now() };
      lsSet(CACHE_KEY, JSON.stringify(_cache));
      UI.lastSync = new Date();
      setSync('ok');
      draw();
    }).catch(function (e) {
      setSync('err', /access key/i.test(e.message) ? 'Add your access key in Settings' : 'Could not reach the Sheet: ' + e.message);
      if (/access key/i.test(e.message) && UI.page !== 'settings') { UI.page = 'settings'; draw(); }
    });
  }
  function post(body) {
    body.key = apiKey();
    return fetch(apiUrl(), { method:'POST', body:JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Save failed'); return j; });
  }
  function applyData(d) {
    TABLES.forEach(function (t) { DATA[t] = (d && d[t]) || []; });
    var sd = (DATA.Settings || []).filter(function (s) { return s.key === 'period_start_day'; })[0];
    if (sd && +sd.value >= 1 && +sd.value <= 28) START_DAY = +sd.value;
  }
  function persistCache() { _cache = { data:DATA, at:Date.now() }; lsSet(CACHE_KEY, JSON.stringify(_cache)); }

  function saveRow(table, row) {
    var isNew = !row.id;
    var tmpId = row.id || ('tmp-' + Date.now());
    var local = Object.assign({}, row, { id: tmpId });
    var arr = DATA[table] = DATA[table] || [];
    var idx = arr.findIndex(function (r) { return r.id === tmpId; });
    if (idx > -1) arr[idx] = local; else arr.push(local);
    draw();
    setSync('busy');
    var send = Object.assign({}, row); if (isNew) delete send.id;
    return post({ action:'upsert', table:table, row:send }).then(function (j) {
      var i = arr.findIndex(function (r) { return r.id === tmpId; });
      if (i > -1) arr[i] = j.row;
      persistCache(); UI.lastSync = new Date(); setSync('ok'); draw();
      return j.row;
    }).catch(function (e) { setSync('err', e.message); toast('Not saved: ' + e.message); throw e; });
  }
  function deleteRow(table, id) {
    var arr = DATA[table] || [];
    var i = arr.findIndex(function (r) { return r.id === id; });
    var removed = i > -1 ? arr.splice(i, 1)[0] : null;
    draw(); setSync('busy');
    return post({ action:'delete', table:table, id:id }).then(function () {
      persistCache(); UI.lastSync = new Date(); setSync('ok');
    }).catch(function (e) {
      if (removed) arr.splice(i, 0, removed);
      setSync('err', e.message); toast('Not deleted: ' + e.message); draw();
    });
  }

  // ─── navigation ───────────────────────────────────────────────────────────
  function drawNav() {
    var links = '';
    NAV.forEach(function (g) { g.items.forEach(function (it) {
      if (it[0] === 'settings') return;
      links += '<button class="navlink' + (UI.page === it[0] ? ' on' : '') + '" data-nav="' + it[0] + '">' + it[1] + (BUILT[it[0]] ? '' : '<small>soon</small>') + '</button>';
    }); });
    $('side').innerHTML = '<div class="brand">FlowFin<b>.</b></div><nav class="navlinks" aria-label="Pages">' + links + '</nav>' +
      '<button class="navlink' + (UI.page === 'settings' ? ' on' : '') + '" data-nav="settings">Settings</button>';
    $('bottomnav').innerHTML = MOBILE_NAV.map(function (it) {
      if (it[0] === 'add') return '<button class="plus" data-act="addtx" aria-label="Add transaction">+</button>';
      return '<button class="' + (UI.page === it[0] ? 'on' : '') + '" data-nav="' + it[0] + '">' + it[1] + '</button>';
    }).join('');
  }
  function go(page) { UI.page = page; location.hash = page; window.scrollTo(0, 0); draw(); }

  // ─── draw dispatcher (pages never call each other) ────────────────────────
  function draw() {
    drawNav();
    Object.keys(CHARTS).forEach(function (k) { CHARTS[k].destroy(); delete CHARTS[k]; });
    var v = $('view');
    if (UI.page === 'dashboard') v.innerHTML = dashboardHTML();
    else if (UI.page === 'transactions') v.innerHTML = transactionsHTML();
    else if (UI.page === 'settings') v.innerHTML = settingsHTML();
    else if (UI.page === 'budgets') v.innerHTML = budgetsHTML();
    else if (UI.page === 'subscriptions') v.innerHTML = recurringHTML();
    else v.innerHTML = soonHTML();
    if (UI.page === 'dashboard') {
      var charts = function () { if (UI.page === 'dashboard') { dashboardCharts(); savingsChart(); netSavingsChart(); } };
      if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(charts); else charts();
    }
  }

  function topbar(title, withPeriod, extra) {
    var p = periodAt(UI.periodOffset);
    return '<div class="topbar"><h1>' + title + '</h1>' + syncHTML() +
      (withPeriod ? '<div class="period"><button class="iconbtn" data-act="prev" aria-label="Previous period">‹</button><span>' +
        periodLabel(p) + '</span><button class="iconbtn" data-act="next" aria-label="Next period">›</button></div>' : '') + (extra || '') + '</div>';
  }

  // ─── Dashboard ────────────────────────────────────────────────────────────
  function sw(n) { return fmtCHF.format(n || 0); }           // 1’234.50
  function sw0(n) { return fmt0.format(Math.round(n || 0)); }  // 1’235
  function sumBy(list, fn) { return list.reduce(function (s, x) { return s + (fn(x) || 0); }, 0); }
  function periodDay(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.'; }
  function signed(n) { return (n < 0 ? '−' : '+') + sw(Math.abs(n)); }
  function kpi(label, val, note) { return '<div class="kpi"><label>' + label + '</label><b>' + val + '</b><small>' + (note || '&nbsp;') + '</small></div>'; }

  // Collapsible sections: open/closed remembered in this browser only
  var FOLD_KEY = 'ff_fold_v1';
  function foldState() { try { return JSON.parse(lsGet(FOLD_KEY)) || {}; } catch (e) { return {}; } }
  function fold(id, title, right, body, defOpen) {
    var st = foldState(), open = id in st ? st[id] : defOpen;
    return '<details class="fold card" data-fold="' + id + '"' + (open ? ' open' : '') + '><summary><h3>' + title +
      (right ? '<span class="r">' + right + '</span>' : '') + '</h3></summary><div class="foldbody">' + body + '</div></details>';
  }

  // Drill-through: any element with data-drill opens Transactions with these filters
  function drill(f) {
    return ' data-drill="' + esc(JSON.stringify(f)) + '" tabindex="0" role="link"';
  }

  function dashboardHTML() {
    if (!txs().length && UI.sync !== 'ok') return topbar('Dashboard', true) + '<div class="empty">Loading your data from the Sheet…</div>';
    var m = periodModel(UI.periodOffset), T = m.totals;
    var h = topbar('Dashboard', true, '<button class="btn primary" data-act="addtx">+ Add</button>');

    h += '<section class="hero">';
    if (m.isCurrent) {
      var left = m.daysInPeriod - m.daysElapsed, pe = periodEndProjection(m);
      h += '<div class="main"><div class="eyebrow">Safe to spend today</div>' +
        '<div class="bignum"><span class="cur">CHF</span><span class="val">' + sw(m.safeToday) + '</span></div>' +
        '<p class="why">' + sw0(m.avg.freeCash) + ' free cash over ' + m.daysInPeriod + ' days gives ' + sw(m.dailyBudget) + ' a day. ' +
        (m.spentToday > 0 ? 'You have spent ' + sw(m.spentToday) + ' today.' : m.spentToday < 0 ? 'Refunds put you ' + sw(-m.spentToday) + ' up today.' : 'Nothing spent yet today.') + '</p></div>' +
        '<div class="side">' +
        '<div class="line"><span>Available now</span><span class="num ' + (m.availableNow < 0 ? 'neg' : '') + '">' + sw(m.availableNow) + '</span></div>' +
        (m.scheduledFree ? '<div class="line"><span>After scheduled</span><span class="num ' + (m.afterScheduled < 0 ? 'neg' : '') + '">' + sw(m.afterScheduled) + '</span></div>' : '') +
        (pe ? '<div class="line" style="display:block"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span>Projected by ' + periodDay(m.p.end) + '</span><span class="num ' + (pe.end < 0 ? 'neg' : '') + '">' + signed(pe.end) + '</span></div>' +
          '<div class="projnote">Allowance balance now ' + signed(pe.now) + ', plus ' + sw0(pe.budgetLeft) + ' allowance for ' + pe.daysLeft + ' days, minus ' + sw0(pe.sched) + ' scheduled and ' + sw0(pe.still - pe.sched) + ' ' + (pe.basis === 'pace' ? 'at this period’s pace' : 'usual spending') + '. Last period ended ' + signed(pe.prevEnd) + '.</div></div>' : '') +
        '<div class="line" style="display:block"><div style="display:flex;justify-content:space-between;font-size:14px"><span>Day ' + m.daysElapsed + ' of ' + m.daysInPeriod + '</span><span class="num soon" style="font-size:13px">' + left + ' day' + (left === 1 ? '' : 's') + ' left</span></div>' +
        '<div class="progress"><i style="width:' + Math.round(m.daysElapsed / m.daysInPeriod * 100) + '%"></i></div></div>' +
        '</div>';
    } else {
      h += '<div class="main"><div class="eyebrow">Period result</div>' +
        '<div class="bignum"><span class="cur">CHF</span><span class="val ' + (T.netCashFlow < 0 ? 'neg' : '') + '">' + sw(T.netCashFlow) + '</span></div>' +
        '<p class="why">Net cash flow for ' + periodLabel(m.p) + ': income minus expenses.</p></div>' +
        '<div class="side"><div class="line"><span>Net saved</span><span class="num ' + (T.netSaved < 0 ? 'neg' : '') + '">' + sw(T.netSaved) + '</span></div>' +
        '<div class="line"><span>Savings rate</span><span class="num">' + (T.savingsRate * 100).toFixed(1) + '%</span></div></div>';
    }
    h += '</section>';
    h += upcomingHTML(m);
    if (!m.isCurrent) var pe = null;

    h += '<section class="kpis">' +
      kpi('Income', sw(T.income), T.expectedIncome ? '<span class="tag exp">expected</span>' : '') +
      kpi('Expenses', sw(T.expenses), T.expectedExpense ? '<span class="tag exp">incl. 6’700 expected</span>' : (T.refunds ? 'after ' + sw0(T.refunds) + ' refunds' : '')) +
      kpi('Net cash flow', '<span class="' + (T.netCashFlow < 0 ? 'neg' : '') + '">' + sw(T.netCashFlow) + '</span>', '') +
      kpi('Collectibles', sw(T.collectibles), 'at cost') +
      kpi('Net saved', '<span class="' + (T.netSaved < 0 ? 'neg' : '') + '">' + sw(T.netSaved) + '</span>',
        pe ? '<span class="' + (T.netSaved - pe.still < 0 ? 'neg' : '') + '">' + signed(T.netSaved - pe.still) + ' by ' + periodDay(m.p.end) + '</span>' : (m.isCurrent ? '' : 'final')) +
      kpi('Savings rate', (T.savingsRate * 100).toFixed(1) + '%', T.financialInvesting ? sw0(T.financialInvesting) + ' invested' : '') +
      '</section>';

    h += '<section class="card"><h3>Allowance balance<span class="r legend">' +
      '<span><i style="border-top:2px solid var(--ink)"></i>This period</span>' +
      '<span><i style="border-top:2px dashed var(--faint)"></i>Previous period</span>' +
      (m.isCurrent ? '<span><i style="border-top:2px dotted var(--ink)"></i>Projected</span>' : '') +
      '<span><i style="border-top:2px solid var(--signal)"></i>Below zero</span></span></h3>' +
      '<p class="chartnote">Starts at 0 each period. Every day adds your allowance of ' + sw(m.dailyBudget) + ' (salary minus household, averaged, spread over the period) and subtracts what you spent that day, household excluded. ' +
      'Above 0: you are spending less than your allowance. Net saved above is different: it counts this month’s whole salary already, so it includes the allowance for the days still to come.</p>' +
      '<div class="chartbox"><canvas id="chDaily" role="img" aria-label="Allowance balance for the period, ' + sw(m.dailyBudget) + ' a day"></canvas></div></section>';

    h += '<div class="grid2">' + budgetForecastHTML(m) + categoryHTML(m) + '</div>';

    var sp = savingsProjection();

  // ─── Recurring items (detector ported from Base44, plus income and an "active" check) ─
  var INTERVALS = [
    { label:'weekly', days:7, tol:3, months:0, perYear:52 },
    { label:'monthly', days:30, tol:7, months:1, perYear:12 },
    { label:'quarterly', days:91, tol:14, months:3, perYear:4 },
    { label:'yearly', days:365, tol:30, months:12, perYear:1 }
  ];
  function normDesc(d) { return String(d || '').toLowerCase().replace(/\d{4,}/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function median(a) { var s = a.slice().sort(function (x, y) { return x - y; }), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

  function nextAfter(lastDate, iv) { return iv.months ? addMonthsKeepDay(lastDate, iv.months) : addDays(lastDate, iv.days); }
  function detectRecurring() {
    var t = today(), groups = {};
    txs().forEach(function (tx) {
      if (!tx.date || !tx.description || pd(tx.date) > t) return;           // scheduled entries are shown separately
      if (tx.category === 'Collectibles') return;                           // purchases, not commitments
      var nd = normDesc(tx.description); if (!nd) return;
      var k = nd + '|' + tx.type; (groups[k] = groups[k] || []).push(tx);
    });
    function patternOf(grp) {
      grp.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      var gaps = []; for (var i = 1; i < grp.length; i++) gaps.push(daysBetween(pd(grp[i - 1].date), pd(grp[i].date)));
      var med = median(gaps), iv = INTERVALS.filter(function (v) { return Math.abs(med - v.days) <= v.tol; })[0];
      if (!iv) return null;
      var ok = gaps.filter(function (gp) { return Math.abs(gp - iv.days) <= iv.tol * 1.5; }).length / gaps.length;
      var need = iv.label === 'yearly' ? 2 : 3;

    }

      var g = groups[k]; if (g.length < 2) return;

      var medAmt = median(g.map(function (x) { return +x.amount || 0; }));
      var core = g.filter(function (x) { return Math.abs((+x.amount || 0) - medAmt) <= Math.max(medAmt * 0.25, 2); });
      var sets = [core];

      if (rest.length >= 3) { var m2 = median(rest.map(function (x) { return +x.amount || 0; })); sets.push(rest.filter(function (x) { return Math.abs((+x.amount || 0) - m2) <= Math.max(m2 * 0.25, 2); })); }

  // ─── Budgets (shared by the Budgets page and the dashboard gauges) ────────
  // Spend = expense + investment rows in the category minus refunds in it, whole period (scheduled included).
  // Rollover: effective limit = base + last period's unspent amount (never a deficit).
  function catSpend(cat, p, skipOneOffs) {
    var spent = 0, sched = 0, t = today();
    txs().forEach(function (tx) {
      if (tx.category !== cat || !inPeriod(tx, p)) return;
      if (skipOneOffs && tx.anomaly_status === 'excluded') return;
      var a = +tx.amount || 0;
      if (tx.type === 'expense' || tx.type === 'investment') { spent += a; if (pd(tx.date) > t) sched += a; }
      else if (tx.type === 'refund') spent -= a;
    });
    return { spent:spent, sched:sched };
  }
  function budgetRows(offset) {
    var p = periodAt(offset), prev = periodAt(offset - 1), map = {};
    (DATA.Budget || []).forEach(function (b) { map[b.category] = b; });
    var cats = Object.keys(CATEGORIES);
    Object.keys(map).forEach(function (c) { if (cats.indexOf(c) < 0) cats.push(c); });
    return cats.map(function (c) {
      var b = map[c] || null, base = b ? +b.monthly_limit || 0 : 0, roll = b && truthy(b.rollover_enabled);
      var carry = 0;
      if (roll && base > 0) carry = Math.max(0, base - catSpend(c, prev).spent);
      var s = catSpend(c, p), limit = base + carry;
      return { cat:c, b:b, base:base, roll:roll, carry:carry, limit:limit, spent:s.spent, sched:s.sched,
        pct: limit > 0 ? s.spent / limit : 0, left: limit - s.spent };
    });
  }
  function truthy(v) { return v === true || String(v).toLowerCase() === 'true'; }
  function ledger(row, offset) {
    var out = [], run = 0;
    for (var i = 6; i >= 0; i--) {
      var p = periodAt(offset - i), sp = catSpend(row.cat, p).spent, sur = Math.max(0, row.base - sp);
      run += sur;
      out.push({ label:periodLabel(p), spent:sp, surplus:sur, run:run, current:i === 0 });
    }
    return out;
  }

  // ─── Transactions ─────────────────────────────────────────────────────────
  // ─── Tags, rules and foreign currency helpers ─────────────────────────────
  function tagsOf(tx) { return String(tx.tags || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean); }
  function allTags() {
    var m = {};
    txs().forEach(function (tx) {
      var net = tx.type === 'refund' ? -(+tx.amount || 0) : tx.type === 'income' ? 0 : (+tx.amount || 0);
      tagsOf(tx).forEach(function (t) {
        m[t] = m[t] || { tag:t, total:0, n:0, from:tx.date, to:tx.date };
        m[t].total += net; m[t].n++;
        if (tx.date < m[t].from) m[t].from = tx.date; if (tx.date > m[t].to) m[t].to = tx.date;
      });
    });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return a.to < b.to ? 1 : -1; });
  }
  function setting(key, def) {

  function cardFeePct() { var v = parseFloat(setting('card_fee_pct', 1.75)); return isNaN(v) ? 1.75 : v; }

  // Rules: description contains the match text (case-insensitive). Lower priority number wins, then the longer match.
  function sortedRules() {
    return (DATA.Rule || []).filter(function (r) { return String(r.match || '').trim(); }).slice().sort(function (a, b) {
      var pa = +a.priority || 100, pb = +b.priority || 100;
      return pa !== pb ? pa - pb : String(b.match).length - String(a.match).length;
    });
  }
  function matchRule(desc) {
    var d = String(desc || '').toLowerCase();
    if (!d.trim()) return null;
    return sortedRules().filter(function (r) { return d.indexOf(String(r.match).trim().toLowerCase()) > -1; })[0] || null;
  }
  // Suggested rules: a description used 3+ times that almost always lands in the same category
  function suggestedRules() {
    var by = {};
    txs().forEach(function (tx) {
      var k = String(tx.description || '').trim(); if (!k) return;
      (by[k] = by[k] || []).push(tx);
    });
    return Object.keys(by).filter(function (k) { return by[k].length >= 3 && !matchRule(k); }).map(function (k) {
      var list = by[k];
      function top(field) {
        var c = {}; list.forEach(function (t) { var v = t[field] || ''; c[v] = (c[v] || 0) + 1; });
        var best = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; })[0];
        return { v:best, share:c[best] / list.length };
      }
      var cat = top('category'), sub = top('subcategory'), type = top('type'), acct = top('account');
      if (cat.share < 0.9 || sub.share < 0.8) return null;
      return { match:k, category:cat.v, subcategory:sub.v, type:type.share >= 0.8 ? type.v : '', account:acct.share >= 0.8 ? acct.v : '', n:list.length };
    }).filter(Boolean).sort(function (a, b) { return b.n - a.n; });
  }

  // ─── Transactions list ────────────────────────────────────────────────────
  function filteredTx() {
    var f = UI.tx, p = periodAt(UI.periodOffset), q = f.q.trim().toLowerCase();
    return txs().filter(function (tx) {
      if (f.scope === 'period' && !inPeriod(tx, p)) return false;
      if (f.type && tx.type !== f.type) return false;
      if (f.category && tx.category !== f.category) return false;
      if (f.account && tx.account !== f.account) return false;
      if (f.sub && (tx.subcategory || '') !== f.sub) return false;
      if (f.from && tx.date < f.from) return false;
      if (f.to && tx.date > f.to) return false;
      if (f.tag && tagsOf(tx).indexOf(f.tag) < 0) return false;
      if (f.dayToDay && !((tx.type === 'expense' && !isInfra(tx, roles())) || tx.type === 'refund')) return false;

      '<div class="field"><label for="msub">Subcategory</label><select id="msub">' + (subs.length ? subs : ['—']).map(function (s) { return opt(s === '—' ? '' : s, s, FORM.subcategory || ''); }).join('') + '</select></div>' +
      '<div class="field"><label for="macct">Account</label><select id="macct">' + ACCOUNTS.map(function (x) { return opt(x[0], x[1], FORM.account); }).join('') + '</select></div>' +
      '<div class="field"><label for="mtags">Tags (comma separated)</label><input id="mtags" list="mtagList" autocomplete="off" placeholder="e.g. Singapore 2026" value="' + esc(FORM.tags || '') + '"></div>' +
      '<datalist id="mtagList">' + tagList.map(function (x) { return '<option value="' + esc(x.tag) + '">'; }).join('') + '</datalist>' +
      '<div class="field full"><label for="manom">Anomaly review</label><select id="manom">' + opt('','Not reviewed',FORM.anomaly_status || '') + opt('confirmed','Confirmed (keep in projections)',FORM.anomaly_status) + opt('excluded','One-off (exclude from projections)',FORM.anomaly_status) + '</select></div>' +
      '</div>' + (FORM._err ? '<div class="err">' + esc(FORM._err) + '</div>' : '') +
      '<div class="actions">' +
      (FORM.id ? (FORM._confirmDelete
        ? '<span class="left"><button class="btn danger" data-act="delyes">Yes, delete</button> <button class="btn" data-act="delno">Keep</button></span>'
        : '<button class="btn danger left" data-act="del">Delete</button>') : '') +
      '<button class="btn" data-act="mkrule" title="Future transactions with this description get the same category, type and account">Save as rule</button>' +
      '<button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">' + (FORM.id ? 'Save changes' : 'Add transaction') + '</button>' +
      '</div></div></div>';
    $('modalRoot').innerHTML = h;
  }
  function fxInfo() {
    if (!FORM || !FORM.orig_currency || FORM.orig_currency === 'CHF') return '';
    if (FORM._rateErr) return '<span class="neg">' + esc(FORM._rateErr) + '. Enter the CHF amount yourself.</span>';
    if (!FORM._rate) return 'Getting the ' + esc(FORM.orig_currency) + ' rate for this date…';
    return '1 ' + esc(FORM.orig_currency) + ' = ' + FORM._rate.toFixed(4) + ' CHF (ECB, ' + (FORM.date <= ymd(today()) ? periodDay(pd(FORM.date)) : 'latest') + ')' + (FORM._fee ? ' + ' + cardFeePct() + '% fee' : '');
  }
  function readForm() {
    FORM.description = $('mdesc').value; FORM.amount = $('mamt').value; FORM.date = $('mdate').value;
    FORM.category = $('mcat').value; FORM.subcategory = $('msub').value; FORM.account = $('macct').value; FORM.anomaly_status = $('manom').value;
    FORM.tags = $('mtags').value; FORM.orig_currency = $('mcur').value;
    if ($('morig')) FORM.orig_amount = $('morig').value;
    if ($('mfee')) FORM._fee = $('mfee').checked;
  }
  // Recalculate the CHF amount from the foreign amount, the day's rate and the card fee (updates in place, keeps focus)
  function recalcFx() {
    if (!FORM || FORM.orig_currency === 'CHF') return;
    readForm();
    var cur = FORM.orig_currency, date = FORM.date;
    FORM._rateErr = '';
    fxRate(cur, date).then(function (rate) {
      if (!FORM || FORM.orig_currency !== cur || FORM.date !== date) return;
      FORM._rate = rate;
      var o = parseFloat(String(FORM.orig_amount).replace(',', '.'));
      if (o >= 0) {
        var chfAmt = Math.round(o * rate * (1 + (FORM._fee ? cardFeePct() / 100 : 0)) * 100) / 100;
        FORM.amount = chfAmt; if ($('mamt')) $('mamt').value = chfAmt.toFixed(2);
      }
      if ($('mfxinfo')) $('mfxinfo').innerHTML = fxInfo();
    }).catch(function (e) { if (!FORM) return; FORM._rateErr = e.message; if ($('mfxinfo')) $('mfxinfo').innerHTML = fxInfo(); });
    if ($('mfxinfo')) $('mfxinfo').innerHTML = fxInfo();
  }
  function saveForm() {
    readForm();
    var amt = parseFloat(String(FORM.amount).replace(',', '.'));
    if (!FORM.description.trim()) { FORM._err = 'Add a description.'; return drawModal(); }
    if (!(amt >= 0)) { FORM._err = 'Enter the amount as a positive number.'; return drawModal(); }
    if (!FORM.date) { FORM._err = 'Pick a date.'; return drawModal(); }
    var foreign = FORM.orig_currency && FORM.orig_currency !== 'CHF';
    var row = { id:FORM.id, date:FORM.date, description:FORM.description.trim(), category:FORM.category, subcategory:FORM.subcategory,
      amount:Math.round(amt * 100) / 100, type:FORM.type, account:FORM.account, anomaly_status:FORM.anomaly_status, created_date:FORM.created_date,
      tags:tagsOf({ tags:FORM.tags }).join(', '),
      orig_amount:foreign ? Math.round(parseFloat(String(FORM.orig_amount).replace(',', '.')) * 100) / 100 || '' : '',
      orig_currency:foreign ? FORM.orig_currency : '', fx_rate:foreign && FORM._rate ? FORM._rate : '', fx_fee:foreign && FORM._fee ? cardFeePct() : '' };
    var isNew = !FORM.id;
    closeModal();
    saveRow('Transaction', row).then(function () { toast(isNew ? 'Transaction added' : 'Changes saved'); });
  }
  // A matching rule fills the form; otherwise the last transaction with the same description does
  function autofill() {
    if (FORM.id) return;
    readForm();
    var d = FORM.description, r = matchRule(d), last = null;
    if (r) {
      FORM.category = r.category || FORM.category; FORM.subcategory = r.subcategory || ''; if (r.type) FORM.type = r.type; if (r.account) FORM.account = r.account;
      if (r.tags && !FORM.tags) FORM.tags = r.tags;
      FORM._note = 'Rule “' + esc(r.match) + '” applied: ' + ruleText(r);
    } else {
      txs().forEach(function (t) { if (t.description === d && (!last || t.date > last.date)) last = t; });
      if (!last) { FORM._note = ''; return; }
      FORM.category = last.category; FORM.subcategory = last.subcategory; FORM.type = last.type; FORM.account = last.account;
      FORM._note = 'Filled from your last “' + esc(d) + '” on ' + periodDay(pd(last.date));
      if (!FORM.amount) FORM.amount = last.amount;
    }
    drawModal(); var a = $(FORM.orig_currency !== 'CHF' ? 'morig' : 'mamt'); if (a) a.focus();
  }
  function ruleFromForm() {
    readForm();
    var m = FORM.description.trim();
    if (!m) { FORM._err = 'Add a description first; the rule matches on it.'; return drawModal(); }
    var existing = (DATA.Rule || []).filter(function (r) { return String(r.match).trim().toLowerCase() === m.toLowerCase(); })[0];
    var row = Object.assign({}, existing || {}, { match:m, category:FORM.category, subcategory:FORM.subcategory, type:FORM.type, account:FORM.account, tags:'', priority:(existing && existing.priority) || 100 });
    saveRow('Rule', row).then(function () { toast('Rule saved: “' + m + '” → ' + FORM_cat(row)); });
    FORM._note = 'Rule saved. New transactions containing “' + esc(m) + '” will be filled the same way.'; drawModal();
  }
  function FORM_cat(r) { return r.category + (r.subcategory ? ' › ' + r.subcategory : ''); }

  // ─── Settings ─────────────────────────────────────────────────────────────
  function settingsHTML() {
    var h = topbar('Settings', false);
    h += '<div class="card"><h3>Google Sheet connection</h3><div class="field"><label for="surl">Apps Script web app URL</label>' +
      '<input id="surl" value="' + esc(apiUrl()) + '" style="font-family:var(--f-mono);font-size:12px"></div>' +
      '<div class="field" style="margin-top:10px"><label for="skey">Access key (kept only in this browser)</label>' +
      '<input id="skey" type="password" autocomplete="off" value="' + esc(apiKey()) + '" style="font-family:var(--f-mono);font-size:12px"></div>' +
      '<div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" data-act="saveurl">Save &amp; reload</button><button class="btn" data-act="ping">Test connection</button><button class="btn" data-act="reload">Reload data</button></div>' +
      '<div id="pingOut" class="soon" style="margin-top:8px"></div></div>';
    h += '<div class="card"><h3>Base44 transition</h3><p class="soon" style="margin:0 0 10px">Transactions are pulled from Base44 into the Sheet every hour. ' +
      'Until you switch, keep adding and editing transactions in Base44: an hourly pull overwrites edits made here to Base44 entries.</p>' +
      '<div class="actions" style="justify-content:flex-start"><button class="btn" data-act="b44">Pull from Base44 now</button></div>' +
      '<div id="b44Out" class="soon" style="margin-top:8px"></div></div>';
    h += rulesHTML();
    h += '<div class="card"><h3>Foreign card payments</h3><div class="bedit" style="padding-top:0">' +
      '<div class="field"><label for="sfee">Card fee on foreign currency (%)</label><input id="sfee" type="number" step="0.05" min="0" value="' + cardFeePct() + '"></div>' +
      '<button class="btn" data-act="savefee">Save</button></div><p class="soon" style="margin:10px 0 0;font-size:13px">Added to the CHF amount when you enter a foreign-currency payment and tick “Add card fee”. Rates are the ECB reference rates for the transaction date.</p></div>';
    h += '<div class="card"><h3>Data in the Sheet</h3><div>' + TABLES.map(function (t) {
      return '<div class="rowline"><span>' + t + '</span><span class="num">' + (DATA[t] || []).length + '</span></div>';
    }).join('') + '</div><p class="soon" style="margin:12px 0 0">Period runs from day ' + START_DAY + ' to day ' + (START_DAY - 1) + ' of the next month. ' +
      'Free cash uses your average salary and household cost over the last ' + HIST_MONTHS + ' periods.</p></div>';
    return h;
  }
  function rulesHTML() {
    var rules = sortedRules(), sugg = suggestedRules();
    var combos = [];
    Object.keys(CATEGORIES).forEach(function (c) { (CATEGORIES[c].length ? CATEGORIES[c] : ['']).forEach(function (sub) { combos.push([c + '|' + sub, c + (sub ? ' › ' + sub : '')]); }); });
    var h = '<div class="card"><h3>Rules<span class="r">fill in new transactions automatically</span></h3>' +
      '<p class="soon" style="margin:0 0 12px;font-size:13px">When a new description contains the match text, the category, subcategory, type and account are filled in. You can still change them before saving.</p>' +
      '<div class="ruleadd">' +
      '<div class="field"><label for="rmatch">Description contains</label><input id="rmatch" placeholder="e.g. Ricardo" autocomplete="off"></div>' +
      '<div class="field"><label for="rcs">Category</label><select id="rcs">' + combos.map(function (x) { return opt(x[0], x[1], ''); }).join('') + '</select></div>' +
      '<div class="field"><label for="rtype">Type</label><select id="rtype">' + opt('','Keep','') + TYPES.map(function (x) { return opt(x[0], x[1], ''); }).join('') + '</select></div>' +
      '<div class="field"><label for="racct">Account</label><select id="racct">' + opt('','Keep','') + ACCOUNTS.map(function (x) { return opt(x[0], x[1], ''); }).join('') + '</select></div>' +
      '<div class="field"><label for="rtags">Tag (optional)</label><input id="rtags" autocomplete="off"></div>' +
      '<button class="btn primary" data-act="radd">Add rule</button></div>';
    if (rules.length) {
      h += '<div style="margin-top:14px">' + rules.map(function (r) {
        return '<div class="rowline"><span>“' + esc(r.match) + '” <span class="sub">→ ' + ruleText(r) + '</span></span><button class="navlink" data-act="rdel" data-id="' + esc(r.id) + '">Remove</button></div>';
      }).join('') + '</div>';
    } else h += '<div class="empty" style="padding:14px 0">No rules yet. Start with the suggestions below.</div>';
    if (sugg.length) {
      h += '<div class="subhead" style="margin-top:18px"><b>Suggested from your history</b><button class="navlink" data-act="rsuggall">Add all ' + Math.min(sugg.length, 15) + '</button></div>' +
        sugg.slice(0, 15).map(function (r, i) {
          return '<div class="rowline"><span>“' + esc(r.match) + '” <span class="sub">' + r.n + '× → ' + ruleText(r) + '</span></span><button class="navlink" data-act="rsugg" data-i="' + i + '">Add</button></div>';
        }).join('');
    }
    return h + '</div>';
  }
  function saveSetting(key, value) {
    var r = (DATA.Settings || []).filter(function (x) { return x.key === key; })[0];
    return saveRow('Settings', Object.assign({}, r || {}, { key:key, value:value }));
  }
  function soonHTML() {
    var label = '';
    NAV.forEach(function (g) { g.items.forEach(function (it) { if (it[0] === UI.page) label = it[1]; }); });
    var counts = { budgets:'Budget', goals:'FinancialGoal', subscriptions:'Subscription', anomalies:'Transaction', monthly:'Transaction', wealth:'NetWorthEntry' };
    var n = (DATA[counts[UI.page]] || []).length;
    return topbar(label, false) + '<div class="card soon"><h3>Being rebuilt</h3>This page comes in a later checkpoint. Your data for it is already in the Sheet (' + n + ' ' + counts[UI.page] + ' rows).</div>';
  }

  // ─── events (delegated) ───────────────────────────────────────────────────
  document.addEventListener('click', function (e) {
    var n = e.target.closest('[data-nav]'); if (n) return go(n.getAttribute('data-nav'));
    var tx = e.target.closest('[data-tx]'); if (tx) return openTx(tx.getAttribute('data-tx'));
    var dr = e.target.closest('[data-drill]'); if (dr) return openDrill(dr);
    var ty = e.target.closest('[data-type]'); if (ty && FORM) { readForm(); FORM.type = ty.getAttribute('data-type'); return drawModal(); }
    var a = e.target.closest('[data-act]'); if (!a) return;
    var act = a.getAttribute('data-act');
    if (act === 'scrim' && e.target === a) return closeModal();
    if (act === 'prev') { UI.periodOffset--; return draw(); }
    if (act === 'next') { UI.periodOffset++; return draw(); }
    if (act === 'addtx') return openTx(null);
    if (act === 'cancel') return closeModal();
    if (act === 'save') return saveForm();
    if (act === 'del') { readForm(); FORM._confirmDelete = true; return drawModal(); }
    if (act === 'delno') { readForm(); FORM._confirmDelete = false; return drawModal(); }
    if (act === 'delyes') { var id = FORM.id; closeModal(); return deleteRow('Transaction', id).then(function () { toast('Transaction deleted'); }); }
    if (act === 'saveurl') { lsSet(URL_KEY, $('surl').value.trim()); lsSet(KEY_KEY, $('skey').value.trim()); toast('Connection saved'); return loadAll(); }
    if (act === 'b44') {
      var bo = $('b44Out'); bo.textContent = 'Pulling from Base44…'; a.disabled = true;
      post({ action:'syncBase44' }).then(function (j) {
        var r = j.result; bo.innerHTML = '<span class="pos">Done.</span> ' + r.added + ' new, ' + r.updated + ' changed, ' + r.removed + ' removed.';
        return loadAll();
      }).catch(function (err) { bo.innerHTML = '<span class="neg">' + esc(err.message) + '</span>'; })
        .then(function () { var b = document.querySelector('[data-act=b44]'); if (b) b.disabled = false; });
      return;
    }
    if (act === 'reload') return loadAll();
    if (act === 'mkrule') return ruleFromForm();
    if (act === 'projbasis') { lsSet(PROJ_KEY, a.getAttribute('data-v')); return draw(); }
    if (act === 'rtrack') {
      var ri = recurringItems()[+a.getAttribute('data-i')]; if (!ri) return;
      return saveRow('Subscription', { name:ri.name, amount:ri.amount, frequency:ri.frequency, account:ri.account, category:ri.category, subcategory:ri.subcategory,
        next_renewal:ri.next ? ymd(ri.next) : '', status:'active', notes:'', auto_detected:true }).then(function () { toast('Tracking ' + ri.name); });
    }
    if (act === 'tagfilter') { UI.tx.tag = a.getAttribute('data-tag'); UI.tx.scope = 'all'; return draw(); }
    if (act === 'bulktag') {
      var tg = String($('bulktag').value || '').replace(/,/g, ' ').trim();
      if (!tg) { toast('Type a tag first'); return; }
      var rows = filteredTx().filter(function (t) { return tagsOf(t).indexOf(tg) < 0; }).map(function (t) { return Object.assign({}, t, { tags:tagsOf(t).concat([tg]).join(', ') }); });
      if (!rows.length) { toast('All shown already have #' + tg); return; }
      return saveMany('Transaction', rows).then(function () { toast('#' + tg + ' added to ' + rows.length + ' transactions'); });
    }
    if (act === 'radd') {
      var mt = String($('rmatch').value || '').trim(); if (!mt) { toast('Type the text to match'); return; }
      var cs = $('rcs').value.split('|');
      return saveRow('Rule', { match:mt, category:cs[0], subcategory:cs[1] || '', type:$('rtype').value, account:$('racct').value, tags:String($('rtags').value || '').trim(), priority:100 })
        .then(function () { toast('Rule added for “' + mt + '”'); });
    }
    if (act === 'rdel') return deleteRow('Rule', a.getAttribute('data-id')).then(function () { toast('Rule removed'); });
    if (act === 'rsugg' || act === 'rsuggall') {
      var sg = suggestedRules().slice(0, 15), pick = act === 'rsugg' ? [sg[+a.getAttribute('data-i')]] : sg;
      var newRules = pick.filter(Boolean).map(function (r) { return { match:r.match, category:r.category, subcategory:r.subcategory, type:r.type, account:r.account, tags:'', priority:100 }; });
      return saveMany('Rule', newRules).then(function () { toast(newRules.length + ' rule' + (newRules.length === 1 ? '' : 's') + ' added'); });
    }
    if (act === 'savefee') {
      var fv = parseFloat($('sfee').value); if (!(fv >= 0)) { toast('Enter the fee as a number, e.g. 1.75'); return; }
      return saveSetting('card_fee_pct', fv).then(function () { toast('Card fee set to ' + fv + '%'); });
    }
    if (act === 'collmode') { lsSet(COLL_KEY, a.getAttribute('data-v')); return draw(); }
    if (act === 'clearf') { UI.tx = { scope:'period', q:'', type:'', category:'', account:'', sub:'', from:'', to:'', tag:'', dayToDay:false }; return draw(); }
    if (act === 'bsave') {
      var v = parseFloat(String($('blim' + a.getAttribute('data-i')).value).replace(',', '.'));
      if (!(v >= 0)) { toast('Enter the limit as a positive number'); return; }
      var cat = a.getAttribute('data-cat');
      return saveBudget(cat, { monthly_limit: Math.round(v * 100) / 100 }).then(function () { toast(cat + ' limit saved'); });
    }
    if (act === 'ping') {
      var out = $('pingOut'); out.textContent = 'Testing…';
      fetch(apiUrl() + '?action=ping').then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) { out.innerHTML = '<span class="neg">' + esc(j.error) + '</span>'; return; }
          var b = j.base44 ? ' Last Base44 pull: ' + new Date(j.base44.at).toLocaleString('en-GB') + ' (' + j.base44.added + ' new, ' + j.base44.updated + ' changed, ' + j.base44.removed + ' removed).' : ' No Base44 pull yet.';
          out.innerHTML = '<span class="pos">Connected.</span>' + esc(b);
        })
        .catch(function (err) { out.innerHTML = '<span class="neg">Could not connect: ' + esc(err.message) + '</span>'; });
    }
  });
  function openDrill(el) {
    var f = {}; try { f = JSON.parse(el.getAttribute('data-drill')); } catch (err) {}
    UI.tx = { scope:'period', q:'', type:'', category:f.category || '', account:f.account || '', sub:f.sub || '', from:f.from || '', to:f.to || '', tag:'', dayToDay:!!f.dayToDay };
    go('transactions');
  }
  document.addEventListener('toggle', function (e) {
    var d = e.target; if (!d.matches || !d.matches('details[data-fold]')) return;
    var st = foldState(); st[d.getAttribute('data-fold')] = d.open; lsSet(FOLD_KEY, JSON.stringify(st));
    if (d.open) { savingsChart(); netSavingsChart(); }
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-drill]')) openDrill(e.target);
    if (e.key === 'Escape' && FORM) closeModal();
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-tx]')) openTx(e.target.getAttribute('data-tx'));
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'morig' && FORM) { recalcFx(); return; }
    if (id === 'fq') { UI.tx.q = e.target.value; var pos = e.target.selectionStart; draw(); var q = $('fq'); q.focus(); q.setSelectionRange(pos, pos); }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'fscope') { UI.tx.scope = e.target.value; draw(); }
    if (id === 'ftype') { UI.tx.type = e.target.value; draw(); }
    if (id === 'fcat') { UI.tx.category = e.target.value; draw(); }
    if (id === 'facct') { UI.tx.account = e.target.value; draw(); }
    if (id === 'ftag') { UI.tx.tag = e.target.value; draw(); }
    if (e.target.matches && e.target.matches('[data-act=rstatus]')) {
      var sid = e.target.getAttribute('data-id'), st = e.target.value, srow = (DATA.Subscription || []).filter(function (x) { return x.id === sid; })[0];
      if (srow) saveRow('Subscription', Object.assign({}, srow, { status:st })).then(function () { toast(srow.name + ': ' + st); });
    }
    if (id === 'mcur' && FORM) { readForm(); FORM._rate = null; FORM._rateErr = ''; FORM._fee = FORM.account === 'credit_card'; drawModal(); recalcFx(); }
    if ((id === 'mfee' || id === 'mdate' || id === 'macct') && FORM && FORM.orig_currency !== 'CHF') recalcFx();
    if (e.target.matches && e.target.matches('[data-act=broll]')) {
      var bc = e.target.getAttribute('data-cat'), on = e.target.checked;
      saveBudget(bc, { rollover_enabled: on }).then(function () { toast('Rollover ' + (on ? 'on' : 'off') + ' for ' + bc); });
    }
    if (id === 'mcat' && FORM) { readForm(); FORM.subcategory = (CATEGORIES[FORM.category] || [''])[0] || ''; drawModal(); }
    if (id === 'mdesc' && FORM) autofill();
  });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h === 'add') { try { history.replaceState(null, '', '#' + UI.page); } catch (e) {} return openTx(null); } if (h && h !== UI.page) { UI.page = h; draw(); } });

  // ─── boot ─────────────────────────────────────────────────────────────────
  var h0 = location.hash.slice(1), wantAdd = h0 === 'add';
  if (wantAdd) { h0 = 'dashboard'; try { history.replaceState(null, '', '#dashboard'); } catch (e) {} }
  if (h0) UI.page = h0;
  try { _cache = JSON.parse(lsGet(CACHE_KEY)); } catch (e) { _cache = null; }
  if (_cache && _cache.data) { applyData(_cache.data); UI.lastSync = new Date(_cache.at); }
  draw();
  if (wantAdd) openTx(null);
  loadAll();

  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }

  // exposed for the diagnostic check only
  window.FF = { periodModel:periodModel, calcTotals:calcTotals, periodAt:periodAt, applyData:applyData, DATA:DATA };
})();
</script>
